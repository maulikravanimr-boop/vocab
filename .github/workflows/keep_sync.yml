name: Direct Keep Sync to GitHub Pages with AI Sentences

on:
  schedule:
    # Runs daily at 05:00 UTC (10:30 AM IST)
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-keep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade gkeepapi

      - name: Sync Google Keep notes and enrich with Gemini AI
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_MASTER_TOKEN: ${{ secrets.GOOGLE_MASTER_TOKEN }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python sync_keep.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [[ -n $(git status --porcelain index.html) ]]; then
            git add index.html
            git commit -m "Auto-sync Keep notes with Gemini AI sentences [skip ci]"
            git push
          else
            echo "No vocabulary changes detected."
          fi
